    <script>
      (function() {
        try {
          var _fetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return _fetch;
            },
            set: function(fn) {
              _fetch = fn;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          try {
            if (typeof Window !== 'undefined' && Window.prototype) {
              var _protoFetch = Window.prototype.fetch;
              Object.defineProperty(Window.prototype, 'fetch', {
                get: function() {
                  return _protoFetch;
                },
                set: function(fn) {
                  _protoFetch = fn;
                },
                configurable: true,
                enumerable: true
              });
            }
          } catch (err) {}
        }
      })();
    </script>
